const ctr=f=>{const r=svg.getBoundingClientRect();zoomAt(f,r.left+r.width/2,r.top+r.height/2)};
document.getElementById('zi').onclick=()=>ctr(1/1.4);document.getElementById('zo').onclick=()=>ctr(1.4);document.getElementById('zf').onclick=fit;
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!card.hidden)close()});
const lvBtns=[...document.querySelectorAll('.levels button')];
const syncLv=()=>lvBtns.forEach(b=>b.setAttribute('aria-pressed',b.dataset.sty===mapStyle));
lvBtns.forEach(b=>b.onclick=e=>{e.stopPropagation();mapStyle=b.dataset.sty;try{localStorage.setItem('cafemap-style',mapStyle)}catch(_){}syncLv();drawBase();render()});syncLv();
// line style preview control
if(B.preview){const lm=document.getElementById('lmode');lm.hidden=false;const bs=[...lm.querySelectorAll('button')];const sync=()=>bs.forEach(b=>b.setAttribute('aria-pressed',b.dataset.lm===lineMode));sync();
  bs.forEach(b=>b.onclick=e=>{e.stopPropagation();lineMode=b.dataset.lm;try{localStorage.setItem('cafemap-lines',lineMode)}catch(_){}sync();render()})}
// tabs
const tabBtns=[...document.querySelectorAll('.tabs button')],mp=document.getElementById('morph'),mt=document.getElementById('mt'),mplay=document.getElementById('mplay');
let savedStyle=null,mAnim=null;
function setTab(tab){tabBtns.forEach(b=>b.setAttribute('aria-pressed',b.dataset.tab===tab));cancelAnimationFrame(mAnim);stopRide();card.hidden=true;sel=null;
  if(tab==='morph'){if(morphT===null){savedStyle=mapStyle;mapStyle='detail';drawBase()}morphT=+mt.value/1000;wrap.classList.add('morphing');mp.hidden=false}
  else{morphT=null;wrap.classList.remove('morphing');mp.hidden=true;if(savedStyle){mapStyle=savedStyle;savedStyle=null;drawBase()}}
  fit()}
tabBtns.forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
mt.addEventListener('input',()=>{cancelAnimationFrame(mAnim);morphT=+mt.value/1000;mplay.textContent=morphT>=1?'↺ Terug':'▶ Speel af';render()});
mplay.onclick=()=>{cancelAnimationFrame(mAnim);const from=morphT,to=morphT>=1?0:1,t0=performance.now(),dur=matchMedia('(prefers-reduced-motion: reduce)').matches?0:3200*Math.abs(to-from);
  const step=t=>{const k=dur?Math.min(1,(t-t0)/dur):1;morphT=from+(to-from)*k;mt.value=Math.round(morphT*1000);render();if(k<1)mAnim=requestAnimationFrame(step);else mplay.textContent=to===1?'↺ Terug':'▶ Speel af'};mAnim=requestAnimationFrame(step)};
fit();addEventListener('resize',fit);
</script>
</body></html>
