<title>Antwerpen Caféstad Overlay</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>

:root{--bg:#f6f4ef;--land:#eeeae1;--water:#b7d2e4;--road:#ddd6c6;--ring:#cdbd9f;--park:#cfe1c4;--square:#e4ded0;--street:#d2c8b2;--minor:#dcd5c6;--ped:#e6d6b8;--rail:#a59f95;--mainfill:#fffdf8;--maincase:#d3c3a2;--tfill:#faf7f0;--tcase:#d9d0bd;--fg:#1d2126;--muted:#686d74;--card:#ffffff;--line:#e2ddd2;--accent:#e2632a;--accent2:#c7283a;
--display:"Barlow Condensed",system-ui,sans-serif;--body:"Inter",system-ui,sans-serif;--shadow:0 10px 30px rgba(30,25,15,.16)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171b;--land:#1b1f24;--water:#1c3446;--road:#353b43;--ring:#4b4436;--park:#21332a;--square:#262b31;--street:#3a4048;--minor:#2b3138;--ped:#3d382f;--rail:#5d646e;--mainfill:#3b4048;--maincase:#56503f;--tfill:#31363e;--tcase:#3f454d;--fg:#ebe8e2;--muted:#9da3ab;--card:#23272d;--line:#323840;--shadow:0 10px 30px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14171b;--land:#1b1f24;--water:#1c3446;--road:#353b43;--ring:#4b4436;--park:#21332a;--square:#262b31;--street:#3a4048;--minor:#2b3138;--ped:#3d382f;--rail:#5d646e;--mainfill:#3b4048;--maincase:#56503f;--tfill:#31363e;--tcase:#3f454d;--fg:#ebe8e2;--muted:#9da3ab;--card:#23272d;--line:#323840;--shadow:0 10px 30px rgba(0,0,0,.5);color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);display:flex;flex-direction:column}
header{padding-block:12px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.top{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:10px}

.chip[aria-pressed="false"]{opacity:.35}
.chip.focus{outline:2px solid var(--fg)}

#wrap{position:relative;flex:1;min-height:440px;overflow:hidden;touch-action:none}
svg{width:100%;height:100%;display:block;cursor:grab;background:var(--land)}

#card{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:12px;width:300px;max-width:calc(100% - 24px);background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;transition:transform .25s ease,opacity .25s}

.band{display:flex;height:6px}
.band i{flex:1}
.cbody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px}
.eyebrow{font:600 .68rem var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;gap:8px;align-items:center}
.eyebrow .q{border:1px solid var(--line);border-radius:999px;padding:1px 7px;letter-spacing:.02em;text-transform:none;font-weight:500}
#card h2{font-family:var(--display);font-weight:700;font-size:1.65rem;line-height:1;margin:0;text-wrap:balance}
.addr{font-size:.8rem;color:var(--muted);margin:0}

.near small{color:var(--muted);font-size:.66rem}
.near button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:9px;padding:7px 10px;font:600 .76rem var(--body);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn:focus-visible,.ride .arr:focus-visible,.ride .mid:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.x{position:absolute;right:8px;top:12px;width:28px;height:28px;border-radius:50%;border:0;background:transparent;color:var(--muted);font-size:1.1rem;cursor:pointer}
.key{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:12px;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:6px 10px;font-size:.7rem;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
.key span{display:flex;align-items:center;gap:5px}
.dot{width:9px;height:9px;border-radius:50%;border:2px solid var(--fg);background:var(--card);display:inline-block}
.dot.g{border-style:dashed}
.zoom{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:12px;display:flex;flex-direction:column;gap:4px}
.zoom button{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:1.05rem;cursor:pointer;box-shadow:var(--shadow)}
.pulse{animation:pulse 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%{opacity:.55;transform:scale(1)}100%{opacity:0;transform:scale(3.2)}}
@media (max-width:640px){#card{left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));top:auto;bottom:10px;width:auto}.key{display:none}#card:not([hidden])~.zoom{display:none}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}#card{transition:none}}
.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tools #filters{flex:1 1 300px;min-width:0}
.fchip{flex:none;border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:4px 10px;font:500 .72rem var(--body);cursor:pointer}
.fchip[aria-pressed="true"]{background:var(--accent);border:1px solid var(--accent);color:#fff}
.tbtn{flex:none;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;padding:6px 11px;font:600 .76rem var(--body);cursor:pointer}
.tbtn b{background:var(--fg);color:var(--bg);border-radius:999px;padding:1px 7px;margin-left:4px;font-size:.68rem}
.chip{min-width:34px;justify-content:center}
.mine{display:flex;gap:6px;flex-wrap:wrap}
.btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
#note{width:100%;box-sizing:border-box;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:9px;padding:7px 9px;font:.8rem var(--body);resize:vertical}
.tour{display:flex;flex-direction:column;gap:4px}
.trow{display:grid;grid-template-columns:26px 1fr 52px;gap:8px;align-items:center;border:0;background:none;color:var(--fg);padding:3px 4px;border-radius:7px;cursor:pointer;font:.74rem var(--body);text-align:left}
.trow:hover{background:var(--land)}
.trow i{width:22px;height:22px;border-radius:50%;color:#fff;font:700 .7rem var(--body);display:grid;place-items:center;font-style:normal}
.bar{height:8px;background:var(--land);border-radius:99px;overflow:hidden;display:block}
.bar span{display:block;height:100%;border-radius:99px}
#card{max-height:calc(100% - 24px);overflow:auto}
.levels{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:12px;display:flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;box-shadow:var(--shadow)}
.levels button{border:0;background:none;color:var(--muted);font:600 .74rem var(--body);padding:6px 10px;border-radius:7px;cursor:pointer}
.levels button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.levels button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
@media (max-width:640px){.levels{top:auto;bottom:12px}#card:not([hidden])~.levels{display:none}}
text{font-family:var(--body)}
</style>
<header>
  <div class="top">
    <div>
      <h1>Antwerpen <span>caféstad</span></h1>
      <p class="sub">De metrokaart van de poster, op de echte stad gelegd. Tik een café, filter, of laat je verrassen.</p>
    </div>
    <div class="search">
      <input id="q" type="search" placeholder="Zoek een café…" autocomplete="off" aria-label="Zoek een café">
      <div id="results" hidden></div>
    </div>
  </div>
  <div class="chips" id="chips"></div>
  <div class="tools"><div class="chips" id="filters"></div><button class="tbtn" id="rnd">🎲 Verras me</button><button class="tbtn" id="tourBtn">Mijn tocht <b id="tourCount">0</b></button></div>
</header>
<div id="wrap">
  <svg id="map" role="img" aria-label="Kaart van Antwerpen met cafélijnen"></svg>
  <div id="tip"></div>
  <div id="card" hidden></div>
  <div class="key"><span><i class="dot"></i>adres gevonden</span><span><i class="dot g"></i>positie geschat</span><span>Kaart © OpenStreetMap-bijdragers</span></div>
  <div class="levels" role="group" aria-label="Kaartstijl"><button data-lv="1">Rustig</button><button data-lv="2">Straten</button><button data-lv="3">Detail</button></div>
  <div class="zoom"><button id="zi" aria-label="Inzoomen">+</button><button id="zo" aria-label="Uitzoomen">−</button><button id="zf" aria-label="Hele kaart">⤢</button></div>
</div>
<script>
const D=__DATA__, B=__BASE__;
const NS="http://www.w3.org/2000/svg", svg=document.getElementById('map'), wrap=document.getElementById('wrap');
const LAT0=51.214, LON0=4.41, K=100000, C=Math.cos(LAT0*Math.PI/180);
const P=(lat,lon)=>[(lon-LON0)*C*K,(LAT0-lat)*K];
const st=Object.fromEntries(D.stations.map(s=>[s.n,s]));
const LN=Object.fromEntries(D.lines.map(l=>[l.id,l]));
const names=Object.fromEntries(D.lines.map((l,i)=>[l.id,String(i+1)]));
const on=Object.fromEntries(D.lines.map(l=>[l.id,true]));
let view={x:0,y:0,w:4000,h:4000}, sel=null, focusLine=null, ride=null;
const el=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e};
const gBase=el('g',{},svg), gLines=el('g',{},svg), gSt=el('g',{},svg), gLab=el('g',{},svg);
const pts=a=>a.map(([la,lo])=>P(la,lo).join(',')).join(' ');
const ns={'vector-effect':'non-scaling-stroke'};
let mapLevel=3;try{mapLevel=+localStorage.getItem('cafemap-level2')||3}catch(_){}
function circ(la,lo,m){const [x,y]=P(la,lo);return {cx:x,cy:y,r:m*K/111200}}
function drawBase(){
  gBase.innerHTML='';const lv=mapLevel,O=B.osm,R='round';
  const pth=(d,a)=>el('path',{d,fill:'none','stroke-linecap':R,'stroke-linejoin':R,...a,...ns},gBase);
  pth(O.G,{fill:'var(--park)'});
  pth(O.W,{fill:'var(--water)'});
  if(lv>=2)pth(O.R,{stroke:'var(--minor)','stroke-width':lv>=3?1.6:1});
  if(lv>=2)pth(O.P,{stroke:'var(--ped)','stroke-width':lv>=3?2.4:1.6});
  pth(O.Z,{stroke:'var(--rail)','stroke-width':1.3,'stroke-dasharray':'5 3','stroke-linecap':'butt'});
  if(lv>=2){pth(O.T,{stroke:'var(--tcase)','stroke-width':lv>=3?4.2:3.2});pth(O.T,{stroke:'var(--tfill)','stroke-width':lv>=3?2.6:1.8})}
  pth(O.M,{stroke:'var(--maincase)','stroke-width':lv>=2?5.2:4});
  pth(O.M,{stroke:'var(--mainfill)','stroke-width':lv>=2?3.4:2.4});
  const defs=el('defs',{},gBase);
  if(lv>=3)O.N.forEach(([n,L,d],i)=>el('path',{id:'sn'+i,d},defs));
}
drawBase();
const scale=()=>view.w/svg.clientWidth;
const active=id=>on[id]&&(!focusLine||focusLine===id);
function drawLines(){
  gLines.innerHTML='';const s=scale(),n=D.lines.length;
  D.lines.forEach((l,i)=>{
    if(!active(l.id))return;
    const off=focusLine?0:(i-(n-1)/2)*2.2*s,p=l.s.map(x=>P(st[x].lat,st[x].lon));
    const q=p.map((c,j)=>{const a=p[Math.max(0,j-1)],b=p[Math.min(p.length-1,j+1)];const dx=b[0]-a[0],dy=b[1]-a[1],m=Math.hypot(dx,dy)||1;return [c[0]-dy/m*off,c[1]+dx/m*off]});
    const dim=sel&&!st[sel].l.includes(l.id);
    const w=focusLine?5:3.2;
    const pl=el('polyline',{points:q.map(c=>c.join(',')).join(' '),fill:'none',stroke:l.c,'stroke-width':w,'stroke-linejoin':'round','stroke-linecap':'round',opacity:dim?.15:.93,...ns},gLines);
    const hit=el('polyline',{points:pl.getAttribute('points'),fill:'none',stroke:'transparent','stroke-width':10,'data-line':l.id,...ns},gLines);
    hit.style.cursor='pointer';
    hit.addEventListener('pointerenter',e=>tip(e,'Lijn '+names[l.id]));hit.addEventListener('pointerleave',untip);
  });
}
function drawStations(){
  gSt.innerHTML='';gLab.innerHTML='';const s=scale();
  if(mapLevel>=2)B.poi.forEach(([t,la,lo])=>{const [x,y]=P(la,lo);el('rect',{x:x-2.6*s,y:y-2.6*s,width:5.2*s,height:5.2*s,rx:1*s,fill:'var(--muted)',opacity:.7,'pointer-events':'none'},gLab);if(mapLevel>=3||s<1.2){const e=el('text',{x:x+5*s,y:y+3*s,'font-size':8.5*s,'font-style':'italic',fill:'var(--muted)',stroke:'var(--land)','stroke-width':2.5*s,'paint-order':'stroke','pointer-events':'none'},gLab);e.textContent=t}});
  if(mapLevel>=3&&s<2.2){let c=0;const vx0=view.x,vy0=view.y,vx1=view.x+view.w,vy1=view.y+view.h,fs=7.5*s;
    B.osm.N.forEach(([n,L,d,bb],i)=>{if(c>70||bb[2]<vx0||bb[0]>vx1||bb[3]<vy0||bb[1]>vy1)return;if(L<n.length*fs*.62+30*s)return;c++;
      const e=el('text',{'font-size':fs,fill:'var(--muted)',dy:2.6*s,'letter-spacing':'.03em','pointer-events':'none',stroke:'var(--land)','stroke-width':2.4*s,'paint-order':'stroke'},gLab);
      const tp=el('textPath',{href:'#sn'+i,startOffset:'50%','text-anchor':'middle'},e);tp.textContent=n})}
  B.labels.forEach(([t,la,lo,k])=>{const [x,y]=P(la,lo);const e=el('text',{x,y,'font-size':(k==='area'?13:9.5)*s,fill:k==='water'?'#4f86a8':'var(--muted)','font-style':k==='water'?'italic':'normal','font-weight':k==='area'?700:400,'text-anchor':'middle','letter-spacing':k==='area'?'.12em':'0',opacity:.8,'pointer-events':'none'},gLab);e.textContent=k==='area'?t.toUpperCase():t});
  D.stations.forEach(x=>{
    if(!x.l.some(active))return;
    const [cx,cy]=P(x.lat,x.lon),big=x.h||focusLine,r=(x.n===sel?7:big?5.6:3.6)*s,ok=passF(x);
    if(!ok&&activeF.size&&x.n!==sel){el('circle',{cx,cy,r:2.2*s,fill:'var(--muted)',opacity:.35,'data-n':x.n},gSt);return}
    if(activeF.size&&ok)el('circle',{cx,cy,r:r+5*s,fill:'var(--accent)',opacity:.22},gSt);
    if(x.n===sel)el('circle',{cx,cy,r:r,fill:'var(--accent2)',class:'pulse'},gSt);
    const c=el('circle',{cx,cy,r,fill:x.n===sel?'var(--accent2)':me.visited.has(x.n)?'var(--fg)':'var(--card)',stroke:'var(--fg)','stroke-width':x.h?2.2:1.4,...ns},gSt);
    if(x.q==='geschat')c.setAttribute('stroke-dasharray','2 2');
    if(me.fav.has(x.n)){const st2=el('text',{x:cx,y:cy-r-2.5*s,'font-size':10*s,'text-anchor':'middle',fill:'#e8a317',stroke:'var(--land)','stroke-width':2*s,'paint-order':'stroke','pointer-events':'none'},gSt);st2.textContent='★'}
    const hit=el('circle',{cx,cy,r:Math.max(r,12*s),fill:'transparent','data-n':x.n},gSt);
    hit.style.cursor='pointer';
    hit.addEventListener('pointerenter',e=>tip(e,x.n));hit.addEventListener('pointerleave',untip);
    if(x.h||focusLine||s<1.5||sel===x.n){const t=el('text',{x:cx+r+3*s,y:cy+3.5*s,'font-size':(x.h||sel===x.n?11.5:9.5)*s,'font-weight':x.h||sel===x.n?700:500,fill:'var(--fg)',stroke:'var(--land)','stroke-width':3.2*s,'paint-order':'stroke','data-n':x.n},gLab);t.style.cursor='pointer';t.textContent=x.n}
  });
}
function render(){svg.setAttribute('viewBox',`${view.x} ${view.y} ${view.w} ${view.h}`);drawLines();drawStations()}
const tipEl=document.getElementById('tip');
function tip(e,t){if(e.pointerType==='touch')return;const r=wrap.getBoundingClientRect();tipEl.textContent=t;tipEl.style.left=(e.clientX-r.left)+'px';tipEl.style.top=(e.clientY-r.top)+'px';tipEl.style.opacity=1}
function untip(){tipEl.style.opacity=0}
// smooth camera
let anim=null;
function flyTo(lat,lon,w){const [tx,ty]=P(lat,lon);const tw=w||Math.min(view.w,1400),th=tw*view.h/view.w;
  const narrow=svg.clientWidth<640, oy=narrow?th*.22:0, ox=narrow?0:-tw*.12;
  const goal={x:tx-tw/2-ox,y:ty-th/2+oy,w:tw,h:th},start={...view},t0=performance.now(),dur=matchMedia('(prefers-reduced-motion: reduce)').matches?0:650;
  cancelAnimationFrame(anim);
  const step=t=>{const k=dur?Math.min(1,(t-t0)/dur):1,e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;for(const p in view)view[p]=start[p]+(goal[p]-start[p])*e;render();if(k<1)anim=requestAnimationFrame(step)};
  anim=requestAnimationFrame(step)}
// personal state (this browser only)
const store={get(k,d){try{return JSON.parse(localStorage.getItem('cafemap-'+k))??d}catch(_){return d}},set(k,v){try{localStorage.setItem('cafemap-'+k,JSON.stringify(v))}catch(_){}}};
const me={visited:new Set(store.get('visited',[])),fav:new Set(store.get('fav',[])),notes:store.get('notes',{})};
const saveMe=()=>{store.set('visited',[...me.visited]);store.set('fav',[...me.fav]);store.set('notes',me.notes)};
const FILTERS={terras:'Terras',muziek:'Live muziek',bier:'Bier',cocktails:'Cocktails',laat:'Laat open',eten:'Eten',student:'Student',fav:'★ Favorieten',todo:'Nog niet bezocht'};
const activeF=new Set();
const passF=x=>[...activeF].every(f=>f==='fav'?me.fav.has(x.n):f==='todo'?!me.visited.has(x.n):(x.f||[]).includes(f));
// card
const card=document.getElementById('card');
const HOOD={
 'Centrum':'Ligt in de historische binnenstad, op wandelafstand van de Grote Markt en de kathedraal. Ideaal om te combineren met de andere cafés in de straatjes rond het Vleeshuis en de Oude Koornmarkt.',
 'Theaterbuurt':'Ligt tussen de Meir, het Theaterplein en het Mechelseplein, waar winkelpubliek, theaterbezoekers en studenten samenkomen.',
 'Studentenbuurt':'Ligt in de studentenbuurt rond de Stadscampus van de Universiteit Antwerpen en de Ossenmarkt. Tijdens het academiejaar is het hier het drukst.',
 'Stationsbuurt':'Ligt vlak bij Antwerpen-Centraal en de Zoo. Handig als eerste of laatste halte als je met de trein komt.',
 'Zuid':'Ligt op het Zuid, de buurt van het KMSKA, de vroegere dokken en de terrassen rond de Marnixplaats.',
 'Zurenborg':'Ligt in Zurenborg, bekend om de art-nouveaugevels van de Cogels-Osylei en de terrassen op de Dageraadplaats.',
 'Berchem':'Ligt in Berchem, ten zuidoosten van het centrum en een buurt met veel eigen buurtcafés.',
 'Borgerhout':'Ligt in Borgerhout, de bruisende wijk achter het Centraal Station die Time Out in 2025 bij de coolste buurten ter wereld rekende.',
 'Seefhoek':'Ligt in de Seefhoek, de volkse wijk ten noorden van het Centraal Station, genoemd naar het oude Antwerpse Seefbier.',
 'Eilandje':'Ligt op het Eilandje, de oude havenbuurt rond de dokken en het MAS, met veel cafés aan het water.',
 'Dam':'Ligt in de Dambuurt, tegen Park Spoor Noord aan.',
 'Sint-Andries':'Ligt in Sint-Andries, het oude volkse kwartier tussen de Nationalestraat en de Kloosterstraat.'};
const fmtD=d=>d<30?'naast de deur':d<1000?Math.round(d/10)*10+' m':(d/1000).toFixed(1)+' km';
const qLabel={gps:'exacte locatie',adres:'op adres geplaatst',geschat:'positie geschat'};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function pick(n,fly){sel=n;const x=st[n];
  const band=x.l.map(id=>`<i style="background:${LN[id].c}"></i>`).join('');
  const rides=x.l.map(id=>{const s=LN[id].s,i=s.indexOf(n),loop=s[0]===s[s.length-1];const pv=i>0?s[i-1]:(loop?s[s.length-2]:null),nx=i<s.length-1?s[i+1]:null;
    return `<div class="ride"><button class="arr" aria-label="Vorige halte op lijn ${names[id]}" ${pv?`data-go="${esc(pv)}"`:'disabled'}>‹</button><button class="mid" data-line="${id}"><i style="background:${LN[id].c}"></i><span>Lijn ${names[id]} · halte ${i+1}/${s.length}${nx?' → '+esc(nx):''}</span></button><button class="arr" aria-label="Volgende halte op lijn ${names[id]}" ${nx?`data-go="${esc(nx)}"`:'disabled'}>›</button></div>`}).join('');
  const blurb=x.t?`<p class="blurb">${esc(x.t)}</p>`:`<p class="blurb${x.a?'':' soft'}">${esc(x.t||'')}</p>`;
  const near=x.q==='geschat'?[]:D.stations.filter(o=>o.n!==n&&o.q!=='geschat').map(o=>[o,Math.hypot((o.lat-x.lat)*111200,(o.lon-x.lon)*111200*C)]).sort((a,b)=>a[1]-b[1]).slice(0,3);
  const nearH=near.length?`<div class="near"><span>In de buurt</span>${near.map(([o,d])=>`<button data-go="${esc(o.n)}">${esc(o.n)}<small>${fmtD(d)}</small></button>`).join('')}</div>`:'';
  const qq=encodeURIComponent(n+' '+x.a.split(' (')[0]+' Antwerpen'), aq=encodeURIComponent(x.a?x.a.split(' (')[0]+', Antwerpen, België':'');
  const maps=x.a?`<a class="btn primary" target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/search/?api=1&query=${qq}">Google Maps ↗</a><a class="btn" target="_blank" rel="noopener noreferrer" href="https://maps.apple.com/?q=${encodeURIComponent(n)}&address=${aq}">Apple Kaarten ↗</a><button class="btn" data-copy="${esc(x.a.split(' (')[0]+', Antwerpen')}">Kopieer adres</button>`:'';
  card.innerHTML=`<div class="band">${band}</div><button class="x" aria-label="Sluiten">×</button><div class="cbody"><div class="eyebrow">${x.b?esc(x.b):'Onbekend adres'}${x.h?' · knooppunt':''}<span class="q">${qLabel[x.q]}</span></div><h2>${esc(n)}</h2>${x.a?`<p class="addr">${esc(x.a)}</p>`:''}${blurb}${nearH}<div class="rides">${rides}</div><div class="actions">${maps}</div><div class="mine"><button class="btn${me.visited.has(n)?' on':''}" data-visit>${me.visited.has(n)?'✓ Bezocht':'Markeer als bezocht'}</button><button class="btn${me.fav.has(n)?' on':''}" data-fav>${me.fav.has(n)?'★ Favoriet':'☆ Favoriet'}</button></div><textarea id="note" rows="2" placeholder="Eigen notitie, bv. 'Westmalle getest, top'">${esc(me.notes[n]||'')}</textarea></div>`;
  card.hidden=false;const ta=card.querySelector('#note');ta.oninput=()=>{const v=ta.value.trim();if(v)me.notes[n]=v;else delete me.notes[n];saveMe()};
  if(fly)flyTo(x.lat,x.lon);else render()}
card.addEventListener('click',e=>{e.stopPropagation();
  const cp=e.target.closest('[data-copy]');if(cp){const txt=cp.dataset.copy,done=()=>{cp.textContent='Gekopieerd ✓';setTimeout(()=>cp.textContent='Kopieer adres',1600)};
    const fb=()=>{const r=document.createRange(),sp=document.createElement('span');sp.textContent=txt;cp.after(sp);r.selectNodeContents(sp);const sel=getSelection();sel.removeAllRanges();sel.addRange(r);cp.textContent='Selecteer en kopieer';setTimeout(()=>sp.remove(),6000)};
    try{navigator.clipboard.writeText(txt).then(done,fb)}catch(_){fb()}return}const g=e.target.closest('[data-go]');if(g){stopRide();pick(g.dataset.go,true);return}
  if(e.target.closest('[data-visit]')){const n=sel;me.visited.has(n)?me.visited.delete(n):me.visited.add(n);saveMe();pick(n,false);updTour();return}
  if(e.target.closest('[data-fav]')){const n=sel;me.fav.has(n)?me.fav.delete(n):me.fav.add(n);saveMe();pick(n,false);return}
  const tl=e.target.closest('[data-tourline]');if(tl){showLine(tl.dataset.tourline);return}
  const m=e.target.closest('[data-line]');if(m){showLine(m.dataset.line);return}
  const r=e.target.closest('[data-ride]');if(r){startRide(r.dataset.ride);return}
  const f=e.target.closest('[data-solo]');if(f){focusLine=focusLine?null:f.dataset.solo;syncChips();showLine(f.dataset.solo);return}
  if(e.target.closest('.x')){close()}});
function close(){stopRide();sel=null;card.hidden=true;render()}
function showLine(id){stopRide();sel=null;const l=LN[id];let km=0;for(let i=1;i<l.s.length;i++){const a=st[l.s[i-1]],b=st[l.s[i]];km+=Math.hypot((a.lat-b.lat)*111.2,(a.lon-b.lon)*111.2*C)}
  const known=l.s.filter(n=>st[n].q!=='geschat').length,hoods=[...new Set(l.s.map(n=>st[n].b).filter(Boolean))];
  card.innerHTML=`<div class="band"><i style="background:${l.c}"></i></div><button class="x" aria-label="Sluiten">×</button><div class="cbody"><div class="eyebrow">Lijn<span class="q">${l.s.length} cafés · ${km.toFixed(1)} km</span></div><h2 style="color:${l.c}">Lijn ${names[id]}</h2><p class="addr">${esc(l.s[0])} → ${esc(l.s[l.s.length-1])}</p><p class="blurb">Loopt door ${hoods.slice(0,5).join(', ')}${hoods.length>5?' en meer':''}. ${known} van de ${l.s.length} cafés staan op hun echte adres.</p><p class="addr">Te voet ongeveer ${Math.round(km*1.3/4.5*60)} min stappen (excl. pintjes) · ${l.s.filter(n=>me.visited.has(n)).length}/${l.s.length} bezocht</p><div class="actions">${routeLinks(l)}</div><div class="actions"><button class="btn primary" data-ride="${id}">▶ Rijd mee</button><button class="btn" data-solo="${id}">${focusLine===id?'Toon alle lijnen':'Toon enkel deze lijn'}</button></div></div>`;
  card.hidden=false;render()}
function routeLinks(l){const s=l.s.filter(n=>st[n].a),parts=[];for(let i=0;i<s.length-1;i+=9){parts.push(s.slice(i,i+10))}
  const ad=n=>encodeURIComponent(n+', '+st[n].a.split(' (')[0]+', Antwerpen');
  return parts.map((p,k)=>`<a class="btn" target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/dir/?api=1&travelmode=walking&origin=${ad(p[0])}&destination=${ad(p[p.length-1])}${p.length>2?'&waypoints='+p.slice(1,-1).map(ad).join('%7C'):''}">🚶 Route${parts.length>1?' deel '+(k+1):''} in Google Maps ↗</a>`).join('')}
function startRide(id){stopRide();const s=LN[id].s;let i=0;ride={id,t:null};focusLine=id;syncChips();
  const go=()=>{if(!ride)return;pick(s[i],true);i++;if(i<s.length)ride.t=setTimeout(go,2200);else ride=null};go()}
function stopRide(){if(ride){clearTimeout(ride.t);ride=null}}
// chips
const chips=document.getElementById('chips');
function syncChips(){D.lines.forEach(l=>{const b=document.getElementById('chip-'+l.id);b.setAttribute('aria-pressed',on[l.id]&&(!focusLine||focusLine===l.id));b.classList.toggle('focus',focusLine===l.id)})}
D.lines.forEach(l=>{const b=document.createElement('button');b.className='chip';b.id='chip-'+l.id;b.setAttribute('aria-pressed','true');b.innerHTML=`<i style="background:${l.c}"></i>${names[l.id]}`;b.title='Lijn '+names[l.id];
  b.onclick=()=>{if(focusLine){focusLine=null;on[l.id]=true}else on[l.id]=!on[l.id];syncChips();render()};chips.appendChild(b)});
// filters
const fwrap=document.getElementById('filters');
Object.entries(FILTERS).forEach(([k,lab])=>{const b=document.createElement('button');b.className='fchip';b.textContent=lab;b.setAttribute('aria-pressed','false');b.onclick=()=>{activeF.has(k)?activeF.delete(k):activeF.add(k);b.setAttribute('aria-pressed',activeF.has(k));render()};fwrap.appendChild(b)});
// random café (respects filters + visible lines)
document.getElementById('rnd').onclick=()=>{const pool=D.stations.filter(x=>x.a&&x.l.some(active)&&passF(x)&&x.n!==sel);if(!pool.length)return;const x=pool[Math.floor(Math.random()*pool.length)];stopRide();pick(x.n,true);flyTo(x.lat,x.lon,1000)};
// tour / stamp card
function updTour(){document.getElementById('tourCount').textContent=me.visited.size+'/'+D.stations.length}
document.getElementById('tourBtn').onclick=()=>{stopRide();sel=null;
  const rows=D.lines.map(l=>{const v=l.s.filter(n=>me.visited.has(n)).length,p=Math.round(v/l.s.length*100);return `<button class="trow" data-tourline="${l.id}"><i style="background:${l.c}">${names[l.id]}</i><span class="bar"><span style="width:${p}%;background:${l.c}"></span></span><small>${v}/${l.s.length}${v===l.s.length?' 🏆':''}</small></button>`}).join('');
  const favs=[...me.fav].filter(n=>st[n]).map(n=>`<button data-go="${esc(n)}">${esc(n)}</button>`).join('')||'<span>Nog geen favorieten. Tik ☆ in een café.</span>';
  card.innerHTML=`<div class="band">${D.lines.map(l=>`<i style="background:${l.c}"></i>`).join('')}</div><button class="x" aria-label="Sluiten">×</button><div class="cbody"><div class="eyebrow">Stempelkaart<span class="q">${me.visited.size} van ${D.stations.length} cafés</span></div><h2>Mijn tocht</h2><div class="tour">${rows}</div><div class="near"><span>Favorieten</span>${favs}</div><p class="addr">Je vinkjes, favorieten en notities worden alleen in deze browser bewaard.</p></div>`;
  card.hidden=false;render()};
updTour();
// search
const q=document.getElementById('q'),res=document.getElementById('results');
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ']/g,'');
q.addEventListener('input',()=>{const v=norm(q.value.trim());if(!v){res.hidden=true;return}
  const hits=D.stations.filter(s=>norm(s.n).includes(v)||(s.a&&norm(s.a).includes(v))).slice(0,8);
  res.innerHTML=hits.length?hits.map(s=>`<button data-n="${esc(s.n)}">${s.l.slice(0,4).map(id=>`<span style="width:8px;height:8px;border-radius:50%;background:${LN[id].c};display:inline-block"></span>`).join('')}${esc(s.n)}<small>${esc(s.b||'')}</small></button>`).join(''):'<button disabled>Geen café gevonden</button>';res.hidden=false});
res.addEventListener('click',e=>{const b=e.target.closest('[data-n]');if(!b)return;res.hidden=true;q.value='';focusLine=null;syncChips();stopRide();pick(b.dataset.n,true);flyTo(st[b.dataset.n].lat,st[b.dataset.n].lon,900)});
q.addEventListener('keydown',e=>{if(e.key==='Enter'){const b=res.querySelector('[data-n]');if(b)b.click()}if(e.key==='Escape'){res.hidden=true}});
// pan & zoom
function fit(){const a=svg.clientWidth/svg.clientHeight,cx=-100,cy=-250,h=a>1?4300:4300/Math.max(a,.45)*.62;view={w:h*a,h,x:cx-h*a/2,y:cy-h/2};render()}
function zoomAt(f,px,py){const r=svg.getBoundingClientRect();const mx=view.x+(px-r.left)/r.width*view.w,my=view.y+(py-r.top)/r.height*view.h;const w=Math.min(9000,Math.max(50,view.w*f)),h=w*view.h/view.w;view={x:mx-(mx-view.x)*w/view.w,y:my-(my-view.y)*h/view.h,w,h};render()}
svg.addEventListener('wheel',e=>{e.preventDefault();cancelAnimationFrame(anim);zoomAt(e.deltaY>0?1.15:1/1.15,e.clientX,e.clientY)},{passive:false});
const ptr=new Map();let pinch=0,moved=0,lastPT='touch';
svg.addEventListener('pointerdown',e=>{lastPT=e.pointerType;ptr.set(e.pointerId,[e.clientX,e.clientY]);moved=0;cancelAnimationFrame(anim);if(ptr.size===2){const [a,b]=[...ptr.values()];pinch=Math.hypot(a[0]-b[0],a[1]-b[1])}});
svg.addEventListener('pointermove',e=>{if(!ptr.has(e.pointerId))return;const prev=ptr.get(e.pointerId);ptr.set(e.pointerId,[e.clientX,e.clientY]);const r=svg.getBoundingClientRect();moved+=Math.abs(e.clientX-prev[0])+Math.abs(e.clientY-prev[1]);
  if(moved>4&&!svg.hasPointerCapture(e.pointerId))svg.setPointerCapture(e.pointerId);
  if(ptr.size===1&&moved>4){view.x-=(e.clientX-prev[0])/r.width*view.w;view.y-=(e.clientY-prev[1])/r.height*view.h;svg.setAttribute('viewBox',`${view.x} ${view.y} ${view.w} ${view.h}`)}
  else if(ptr.size===2){const [a,b]=[...ptr.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pinch)zoomAt(pinch/d,(a[0]+b[0])/2,(a[1]+b[1])/2);pinch=d}});
const up=e=>{ptr.delete(e.pointerId);if(ptr.size<2)pinch=0;if(moved>4)render()};
svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',up);
svg.addEventListener('click',e=>{if(moved>4)return;untip();
  const r=svg.getBoundingClientRect(),mx=view.x+(e.clientX-r.left)/r.width*view.w,my=view.y+(e.clientY-r.top)/r.height*view.h,s=scale();
  const tn=e.target.getAttribute&&e.target.getAttribute('data-n');
  if(tn){stopRide();pick(tn,true);return}
  let best=null,bd=(lastPT==='mouse'?16:30)*s;
  D.stations.forEach(x=>{if(!x.l.some(active))return;const [cx,cy]=P(x.lat,x.lon),d=Math.hypot(cx-mx,cy-my);if(d<bd){bd=d;best=x.n}});
  if(best){stopRide();pick(best,true);return}
  const ln=e.target.getAttribute&&e.target.getAttribute('data-line');
  if(ln){showLine(ln);return}
  if(!card.hidden)close()});
const ctr=f=>{const r=svg.getBoundingClientRect();zoomAt(f,r.left+r.width/2,r.top+r.height/2)};
document.getElementById('zi').onclick=()=>ctr(1/1.4);document.getElementById('zo').onclick=()=>ctr(1.4);document.getElementById('zf').onclick=fit;
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!card.hidden)close()});
const lvBtns=[...document.querySelectorAll('.levels button')];
const syncLv=()=>lvBtns.forEach(b=>b.setAttribute('aria-pressed',+b.dataset.lv===mapLevel));
lvBtns.forEach(b=>b.onclick=e=>{e.stopPropagation();mapLevel=+b.dataset.lv;try{localStorage.setItem('cafemap-level2',mapLevel)}catch(_){}syncLv();drawBase();render()});syncLv();
fit();addEventListener('resize',fit);
</script>
